<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="robots"
      content="noindex, nofollow"
    />

    <meta
      name="theme-color"
      content="#050914"
    />

    <title>404 | Raji Mubarak Olohunisola</title>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #050914;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 75% 20%,
            rgba(37, 99, 235, 0.18),
            transparent 32%
          ),
          radial-gradient(
            circle at 20% 80%,
            rgba(34, 211, 238, 0.08),
            transparent 30%
          ),
          #050914;
      }

      .page {
        width: min(720px, calc(100% - 40px));
        padding: 48px 24px;
        text-align: center;
      }

      .code {
        margin: 0;
        color: #3b82f6;
        font-size: clamp(6rem, 18vw, 11rem);
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.08em;
      }

      .eyebrow {
        margin: 28px 0 12px;
        color: #8d9ab0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 520px;
        margin: 18px auto 0;
        color: #8d9ab0;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 32px;
        padding: 0 22px;
        border-radius: 999px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 180ms ease,
          background 180ms ease;
      }

      a:hover {
        background: #3b82f6;
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 4px;
      }

      .name {
        margin-top: 48px;
        color: #64748b;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (max-width: 520px) {
        .page {
          padding: 32px 18px;
        }

        .code {
          font-size: 7rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }

        a:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <p class="code">404</p>

      <p class="eyebrow">Page not found</p>

      <h1>This page doesn't exist.</h1>

      <p>
        The page you're looking for may have moved, been removed,
        or the URL may be incorrect.
      </p>

      <a href="/">
        Return to portfolio
      </a>

      <div class="name">
        Raji Mubarak Olohunisola
      </div>
    </main>
  </body>
</html>
